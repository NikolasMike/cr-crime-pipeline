cr_crime:
  target: pg
  outputs:
    pg:
      type: postgres
      host: localhost
      port: 5432
      user: postgres
      password: postgres
      dbname: crime
      schema: analytics
      threads: 4
    bq_dev:
      type: bigquery
      method: service-account
      project: cr-crime-pipeline
      dataset: analytics_dev
      location: US
      keyfile: "{{ env_var('GCP_KEYFILE', '/home/codespace/.gcp/dbt-runner.json') }}"
      threads: 4
    bq_prod:
      type: bigquery
      method: service-account
      project: cr-crime-pipeline
      dataset: analytics
      location: US
      keyfile: "{{ env_var('GCP_KEYFILE', '/home/codespace/.gcp/dbt-runner.json') }}"
      threads: 4
