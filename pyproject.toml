description = "Add your description here"
authors = [
    { name = "Mike", email = "124460512+NikolasMike@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-bigquery>=1.12.1",
    "dbt-postgres>=1.11.0",
