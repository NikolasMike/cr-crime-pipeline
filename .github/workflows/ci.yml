name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --locked

      - name: Create raw schema and table
        run: |
          psql -h localhost -U postgres -d crime -c "CREATE SCHEMA raw;"
          psql -h localhost -U postgres -d crime -f sql/create_raw.sql

      - name: Download police statistics
        run: ./scripts/download_police.sh

      - name: Load raw data
        run: uv run python src/load_raw.py

      - name: Build dbt project (seeds, models and tests)
        working-directory: cr_crime
        run: |
          uv run dbt deps
          uv run dbt build
