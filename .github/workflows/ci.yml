name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --locked

      - name: Lint SQL with sqlfluff
        run: uv run sqlfluff lint cr_crime/models --disable-progress-bar

      - name: Create raw schema and table
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d crime -c "CREATE SCHEMA raw;"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d crime -f sql/create_raw.sql

      - name: Download police statistics
        run: ./scripts/download_police.sh

      - name: Load raw data
        run: uv run python src/load_raw.py

      - name: Build dbt project (seeds, models and tests)
        working-directory: cr_crime
        run: |
          uv run dbt deps
          uv run dbt build

      - name: Generate dbt docs
        working-directory: cr_crime
        run: uv run dbt docs generate

      - name: Collect the docs site
        run: |
          mkdir site
          cp cr_crime/target/index.html cr_crime/target/manifest.json cr_crime/target/catalog.json site/

      - name: Upload the docs site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    needs: dbt-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-bigquery:
    needs: dbt-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --locked

      - name: Write GCP credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          echo "GCP_KEYFILE=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Download police statistics
        run: bash scripts/download_police.sh

      - name: Load raw data into BigQuery
        run: uv run python src/load_raw_bq.py

      - name: Build dbt project in BigQuery (prod)
        working-directory: cr_crime
        run: |
          uv run dbt deps
          uv run dbt build --target bq_prod
